name: Required Lane Catch Rate

on:
  schedule:
    - cron: "45 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  required_lane_catch_rate:
    runs-on: ubuntu-latest
    env:
      CE_RETRIEVAL_PROVIDER: local_native
      CONTEXT_ENGINE_OFFLINE_ONLY: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run existing canary failure gate artifact generation
        run: npm run -s ci:check:retrieval-shadow-canary-gate

      - name: Compute required-lane catch-rate against Q3a seeded-failure corpus
        run: npm run -s ci:check:required-lane-catch-rate
